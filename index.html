<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f1e8">
<title>ZivugArch — Simplified Architecture Prototype</title>
<style>
:root{
  --bg:#f6f1e8;--card:#fffdf9;--card2:#f2ece2;--line:#e7ddd0;--ink:#26322e;--muted:#7d817c;
  --sage:#6f8f7a;--sage-soft:#e8f0e9;--blue:#71869b;--blue-soft:#e8eef4;--gold:#c5a25b;--gold-soft:#f7efd9;
  --rose:#b8796d;--rose-soft:#f5e7e2;--grey:#ece9e3;--shadow:0 5px 22px rgba(55,48,40,.07);
  --radius:18px;--row:68px;--avatar:42px;--pad:16px;--nav:72px;
}
:root[data-theme="dark"]{
  --bg:#151a18;--card:#1d2421;--card2:#252d29;--line:#303a35;--ink:#edf1ee;--muted:#a0aaa4;
  --sage:#9fc0aa;--sage-soft:#26372d;--blue:#a5bdd2;--blue-soft:#26343f;--gold:#d9bd7b;--gold-soft:#3a321f;
  --rose:#dda99d;--rose-soft:#3a2925;--grey:#252b28;--shadow:0 5px 22px rgba(0,0,0,.22);
}
:root[data-density="compact"]{--row:56px;--pad:12px;--avatar:34px;--radius:14px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button,input{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh}.screen{padding:18px var(--pad) 22px}.hidden{display:none!important}
.header{display:flex;align-items:center;gap:10px;margin-bottom:14px}.header-main{flex:1;min-width:0}.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sage);font-weight:800}.title{font-family:Georgia,"Times New Roman",serif;font-size:27px;line-height:1.1;margin:2px 0 0;font-weight:600;letter-spacing:-.02em}.subtitle{color:var(--muted);font-size:13px;margin-top:3px}
.iconbtn{width:40px;height:40px;border:0;border-radius:13px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);display:grid;place-items:center}.iconbtn svg,.nav svg,.contact svg,.mini svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.back{box-shadow:none;background:transparent;width:34px;height:34px}
.search{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:15px;height:46px;padding:0 13px;margin-bottom:12px}.search svg{width:19px;height:19px;fill:none;stroke:var(--muted);stroke-width:1.8}.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);min-width:0}.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:7px;overflow:auto;scrollbar-width:none;margin:0 -2px 13px;padding:2px}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:7px 11px;font-size:12.5px;font-weight:700}.chip.on{background:var(--sage-soft);border-color:transparent;color:var(--sage)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}.sum{border:0;text-align:left;background:var(--card);border-radius:16px;padding:12px 11px;box-shadow:var(--shadow)}.sum .n{font-family:Georgia,serif;font-size:25px;line-height:1}.sum .l{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.2}.sum.them .n{color:#a77a22}.sum.me .n{color:var(--blue)}.sum.follow .n{color:var(--sage)}
.sectionhead{display:flex;align-items:end;justify-content:space-between;margin:17px 1px 8px}.sectionhead h2{font-size:14px;margin:0}.sectionhead span,.sectionhead button{font-size:12px;color:var(--muted);border:0;background:none}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.row{min-height:var(--row);width:100%;display:flex;align-items:center;gap:11px;padding:9px 12px;border:0;background:transparent;color:inherit;text-align:left;position:relative}.row+.row:before{content:"";position:absolute;left:calc(var(--avatar) + 24px);right:0;top:0;border-top:1px solid var(--line)}.row:active{background:var(--card2)}
.avatar{width:var(--avatar);height:var(--avatar);border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px;background:var(--sage-soft);color:var(--sage)}.avatar.blue{background:var(--blue-soft);color:var(--blue)}.avatar.gold{background:var(--gold-soft);color:#a17b2b}.avatar.rose{background:var(--rose-soft);color:var(--rose)}
.rowmain{flex:1;min-width:0}.rowtop{display:flex;gap:8px;align-items:center}.name{font-size:14.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.time{margin-left:auto;color:var(--muted);font-size:11.5px;white-space:nowrap}.desc{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}.tag{font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 7px;background:var(--grey);color:var(--muted)}.tag.them{background:var(--gold-soft);color:#9a762d}.tag.me{background:var(--blue-soft);color:var(--blue)}.tag.ok{background:var(--sage-soft);color:var(--sage)}
.chev{color:var(--muted);font-size:20px}.empty{padding:26px;text-align:center;color:var(--muted)}
.focus{background:linear-gradient(135deg,var(--card),var(--sage-soft));border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:14px;box-shadow:var(--shadow)}.focus-top{display:flex;gap:10px;align-items:center}.focus-icon{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;color:var(--sage)}.focus h3{margin:0;font-size:14px}.focus p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.contacts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 14px}.contact{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:9px 4px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px}.contact svg{color:var(--sage)}
.info{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}.info-line{display:flex;gap:12px;padding:11px 13px;border-bottom:1px solid var(--line)}.info-line:last-child{border-bottom:0}.info-key{width:108px;color:var(--muted);font-size:12px}.info-val{flex:1;font-size:12.5px;font-weight:700}.attention{background:var(--gold-soft);border:1px solid rgba(197,162,91,.35);border-radius:15px;padding:11px 12px;margin-bottom:12px}.attention.blue{background:var(--blue-soft);border-color:rgba(113,134,155,.25)}.attention .small{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:900;color:var(--muted)}.attention .big{font-size:13.5px;font-weight:800;margin-top:2px}
.primary{border:0;border-radius:13px;background:var(--sage);color:white;font-weight:800;padding:11px 15px}.secondary{border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--ink);font-weight:750;padding:10px 14px}.btnrow{display:flex;gap:8px;margin-top:10px}.btnrow>*{flex:1}
.timeline{position:relative}.event{display:grid;grid-template-columns:31px 1fr;gap:10px;padding:9px 0}.dotline{display:flex;flex-direction:column;align-items:center}.edot{width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--sage)}.eline{width:1px;background:var(--line);flex:1;margin-top:4px}.event:last-child .eline{display:none}.event-title{font-size:13px;font-weight:800}.event-sub{font-size:12px;color:var(--muted);margin-top:2px}.event-time{font-size:10.5px;color:var(--muted);margin-top:3px}
.nav{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);height:calc(var(--nav) + env(safe-area-inset-bottom));padding:7px 7px env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--card) 94%,transparent);border-top:1px solid var(--line);backdrop-filter:blur(15px)}.nav button{border:0;background:none;color:var(--muted);font-size:9.5px;font-weight:700;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center}.nav button.on{color:var(--sage)}
.scrim{position:fixed;z-index:50;inset:0;background:rgba(28,31,29,.34);display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:9px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -15px 50px rgba(0,0,0,.15)}.handle{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}.sheet h2{font:600 23px Georgia,serif;margin:0 0 4px}.sheet p{font-size:12.5px;color:var(--muted);margin:0 0 15px}.setting{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.setting label{font-weight:800;font-size:13px}.options{display:flex;gap:5px}.option{border:1px solid var(--line);background:var(--card2);color:var(--muted);border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800}.option.on{background:var(--sage-soft);color:var(--sage);border-color:transparent}
@media(max-width:370px){.summary{grid-template-columns:1fr 1fr}.summary .sum:last-child{grid-column:span 2}.title{font-size:24px}.nav button{font-size:8.8px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="overlay"></div>
<script>
const $=s=>document.querySelector(s);
const icon=(n)=>{const p={
 recent:'<path d="M4 13a8 8 0 1 0 2-5.3L4 10"/><path d="M4 5v5h5"/><path d="M12 8v5l3 2"/>',
 guys:'<circle cx="12" cy="8" r="3"/><path d="M5 20c.8-4 3.2-6 7-6s6.2 2 7 6"/>',
 girls:'<circle cx="12" cy="8" r="3"/><path d="M5 20c.8-4 3.2-6 7-6s6.2 2 7 6"/><path d="M18 6l2-2m-2 0h2v2"/>',
 shad:'<path d="M7 18a4 4 0 0 1 4-4h2a4 4 0 0 1 4 4"/><circle cx="12" cy="8" r="3"/><path d="M3 11h3m12 0h3"/>',
 match:'<path d="M8 6c-2 0-4 1.5-4 4 0 4 8 9 8 9s8-5 8-9c0-2.5-2-4-4-4-1.7 0-3 1-4 2.4C11 7 9.7 6 8 6z"/>',
 search:'<circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/>',
 settings:'<path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/>',
 back:'<path d="m15 18-6-6 6-6"/>',
 call:'<path d="M6 3h4l1 5-2 2c1.2 2.4 2.9 4.1 5.4 5.3l1.9-2 4.7 1.1v4c0 1-.8 1.8-1.8 1.8C10.4 20.2 3.8 13.6 3.8 4.8 3.8 3.8 4.6 3 5.6 3z"/>',
 msg:'<path d="M4 5h16v11H9l-5 4z"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/>',
 note:'<path d="M5 3h14v18H5z"/><path d="M8 8h8M8 12h8M8 16h5"/>',
 filter:'<path d="M4 6h16M7 12h10M10 18h4"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/>'
}[n]||'<circle cx="12" cy="12" r="8"/>';return `<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`};

const activities=[
 {a:'M',c:'gold',name:'Miriam → Me',time:'14:05',desc:'“She’s thinking about it. I’ll ask tonight.”',tags:[['Waiting on them','them'],['Me ↔ Leah','']]},
 {a:'R',c:'blue',name:'Rivka → Me',time:'11:20',desc:'Sent a list of 10 shadchanim',tags:[['Source','ok'],['6 contacted','']]},
 {a:'Mo',c:'blue',name:'Me → Moshe',time:'09:30',desc:'Leah profile v1 · asked for an opinion',tags:[['Waiting on them','them']]},
 {a:'B',c:'rose',name:'Batya',time:'Yesterday',desc:'No reply since Sep 2',tags:[['Follow up','me']]},
 {a:'L',c:'gold',name:'Leah',time:'Sun',desc:'Profile received from Miriam',tags:[['Idea for me','ok']]}
];
const first=['Miriam','Batya','Dina','Chana','Rivka','Sara','Esther','Tova','Rachel','Nechama','Shira','Malky','Devorah','Rina'];
const last=['Cohen','Levy','Friedman','Weiss','Katz','Green','Stern','Gold','Rosen','Klein'];
const cities=['Jerusalem','Beit Shemesh','Haifa','Tzfat','Bnei Brak','Tel Aviv','Lakewood'];
const shadchanim=Array.from({length:112},(_,i)=>({name:`${first[i%first.length]} ${last[Math.floor(i/first.length)%last.length]}`,city:cities[i%cities.length],status:i%7===0?'me':i%4===0?'them':i%11===0?'new':'',detail:i%4===0?'Waiting for reply':i%7===0?'You need to answer':i%11===0?'Never contacted':'Last contact '+((i%19)+1)+'d ago',sources:(i%5)+1}));
const girls=[
 {name:'Leah Rosen',city:'Jerusalem',detail:'Idea from Miriam · 34 · Teacher',status:'idea'},
 {name:'Noa Weiss',city:'Beit Shemesh',detail:'Previous · 36 · Designer',status:'prev'},
 {name:'Tamar Gold',city:'Jerusalem',detail:'Idea from Chana · 33 · Accountant',status:'idea'},
 {name:'Rina Cohen',city:'Tzfat',detail:'Previous · 35 · Therapist',status:'prev'}
];
const guys=[
 {name:'David Klein',city:'Jerusalem',detail:'35 · Engineer · Yeshivish'},
 {name:'Moshe Green',city:'Tzfat',detail:'39 · Teacher · Chabad'},
 {name:'Ari Stern',city:'Beit Shemesh',detail:'36 · Accountant · Chassidish'},
 {name:'Yossi Katz',city:'Jerusalem',detail:'34 · Architect · Dati Leumi'}
];
const matches=[
 {name:'Me ↔ Leah',detail:'Round 1 · waiting for her side',status:'them'},
 {name:'David ↔ Noa',detail:'Active · Date 2',status:'ok'},
 {name:'Moshe ↔ Tamar',detail:'Idea · not started',status:'idea'},
 {name:'Ari ↔ Rina',detail:'Ended · 3 dates',status:'ended'}
];
const state={screen:'recent',detail:null,theme:localStorage.zaTheme||'warm',density:localStorage.zaDensity||'comfortable',summary:localStorage.zaSummary!=='hide',mode:localStorage.zaMode||'single',filter:'All'};
function init(){applyPrefs();render()}
function applyPrefs(){document.documentElement.dataset.theme=state.theme==='dark'?'dark':'light';document.documentElement.dataset.density=state.density}
function setScreen(s){state.screen=s;state.detail=null;state.filter='All';render();window.scrollTo({top:0,behavior:'smooth'})}
function header(title,sub='',back=false){return `<div class="header">${back?`<button class="iconbtn back" onclick="closeDetail()">${icon('back')}</button>`:''}<div class="header-main"><div class="eyebrow">ZivugArch</div><div class="title">${title}</div>${sub?`<div class="subtitle">${sub}</div>`:''}</div>${!back?`<button class="iconbtn" onclick="openSettings()" aria-label="Settings">${icon('settings')}</button>`:''}</div>`}
function search(placeholder,oninput=''){return `<div class="search">${icon('search')}<input placeholder="${placeholder}" ${oninput?`oninput="${oninput}"`:''}></div>`}
function summary(){if(!state.summary)return'';return `<div class="summary"><button class="sum them" onclick="state.filter='Waiting on them';render()"><div class="n">6</div><div class="l">Waiting on them</div></button><button class="sum me" onclick="state.filter='Waiting on me';render()"><div class="n">3</div><div class="l">Waiting on me</div></button><button class="sum follow" onclick="state.screen='shadchanim';state.filter='Needs contact';render()"><div class="n">4</div><div class="l">Follow-ups</div></button></div>`}
function activityRow(x){return `<button class="row" onclick="${x.name.includes('Miriam')?"openPerson('shad','Miriam Cohen')":x.name.startsWith('Leah')?"openPerson('girl','Leah Rosen')":"void 0"}"><div class="avatar ${x.c}">${x.a}</div><div class="rowmain"><div class="rowtop"><div class="name">${x.name}</div><div class="time">${x.time}</div></div><div class="desc">${x.desc}</div><div class="meta">${x.tags.map(t=>`<span class="tag ${t[1]}">${t[0]}</span>`).join('')}</div></div><span class="chev">›</span></button>`}
function recent(){return `${header('Recent','What changed, newest first')}${summary()}<div class="sectionhead"><h2>Today</h2><button onclick="showFilters()">Filter</button></div><div class="list">${activities.map(activityRow).join('')}</div><div class="sectionhead"><h2>Yesterday</h2></div><div class="list">${activities.slice(2,5).map(activityRow).join('')}</div>`}
function peopleScreen(type){const isGirls=type==='girls', data=isGirls?girls:guys;let title=isGirls?'Girls':'Guys';let chips=isGirls?(state.mode==='single'?['For me','Previous']:['All','Age','City']):['All','Recently added','City'];return `${header(title,isGirls&&state.mode==='single'?'Single Mode · profiles relevant to me':'Browse and search')}${search('Search name, city…')}<div class="chips">${chips.map((c,i)=>`<button class="chip ${i===0?'on':''}">${c}</button>`).join('')}</div><div class="list">${data.map((p,i)=>`<button class="row" onclick="openPerson('${isGirls?'girl':'guy'}','${p.name}')"><div class="avatar ${isGirls?'gold':'blue'}">${p.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div class="rowmain"><div class="rowtop"><div class="name">${p.name}</div></div><div class="desc">${p.city} · ${p.detail}</div>${p.status==='idea'?'<div class="meta"><span class="tag ok">Idea for me</span></div>':''}</div><span class="chev">›</span></button>`).join('')}</div>`}
function shadchanScreen(){let f=state.filter;return `${header('Shadchanim','112 people · sorted by last contact')}${search('Search name, phone or city…','filterShad(this.value)')}<div class="chips">${['All','Waiting on them','Waiting on me','Sources'].map(c=>`<button class="chip ${f===c?'on':''}" onclick="state.filter='${c}';render()">${c}</button>`).join('')}<button class="chip" onclick="showFilters()">${icon('filter')} More</button></div>${f==='Sources'?sourcesView():`${summary()}<div class="list" id="shadList">${shadRows(f)}</div>`}`}
function shadRows(f,q=''){return shadchanim.filter((p,i)=>{if(q&&!p.name.toLowerCase().includes(q.toLowerCase())&&!p.city.toLowerCase().includes(q.toLowerCase()))return false;if(f==='Waiting on them')return p.status==='them';if(f==='Waiting on me')return p.status==='me';if(f==='Needs contact')return p.status==='new';return true}).slice(0,28).map(p=>`<button class="row" onclick="openPerson('shad','${p.name}')"><div class="avatar">${p.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div class="rowmain"><div class="rowtop"><div class="name">${p.name}</div><div class="time">${p.city}</div></div><div class="desc">${p.detail}</div><div class="meta">${p.status==='them'?'<span class="tag them">on them</span>':p.status==='me'?'<span class="tag me">on me</span>':p.status==='new'?'<span class="tag">needs contact</span>':''}<span class="tag">${p.sources} sources</span></div></div><span class="chev">›</span></button>`).join('')}
function filterShad(q){const el=$('#shadList');if(el)el.innerHTML=shadRows(state.filter,q)}
function sourcesView(){return `<div class="focus"><div class="focus-top"><div class="focus-icon">${icon('shad')}</div><div><h3>Rivka’s 10 shadchanim</h3><p>10 total · 6 contacted · 3 replied · 1 follow-up</p></div></div></div><div class="list"><button class="row" onclick="openSource()"><div class="avatar gold">R</div><div class="rowmain"><div class="name">Rivka’s 10 shadchanim</div><div class="desc">Jun 8 · WhatsApp · 4 not contacted</div></div><span class="chev">›</span></button><button class="row"><div class="avatar blue">E</div><div class="rowmain"><div class="name">Tzfat event</div><div class="desc">Jan 12 · 18 people · 16 already contacted</div></div><span class="chev">›</span></button><button class="row"><div class="avatar">S</div><div class="rowmain"><div class="name">Sarah’s list</div><div class="desc">Aug 22 · 50 people · 31 already here</div></div><span class="chev">›</span></button></div>`}
function shidduchim(){return `${header('Shidduchim','Actual pairings and ideas')}${search('Search a person or pair…')}<div class="chips">${['Active','Ideas','Ended'].map((c,i)=>`<button class="chip ${i===0?'on':''}">${c}</button>`).join('')}</div><div class="list">${matches.map(m=>`<button class="row" onclick="openMatch('${m.name}')"><div class="avatar ${m.status==='ok'?'':'gold'}">${icon('match')}</div><div class="rowmain"><div class="name">${m.name}</div><div class="desc">${m.detail}</div><div class="meta">${m.status==='them'?'<span class="tag them">waiting on them</span>':m.status==='idea'?'<span class="tag ok">idea</span>':m.status==='ok'?'<span class="tag ok">active</span>':'<span class="tag">ended</span>'}</div></div><span class="chev">›</span></button>`).join('')}</div>`}
function openPerson(type,name){state.detail={kind:'person',type,name};render();window.scrollTo(0,0)}
function openMatch(name){state.detail={kind:'match',name};render();window.scrollTo(0,0)}
function openSource(){state.detail={kind:'source'};render();window.scrollTo(0,0)}
function closeDetail(){state.detail=null;render()}
function personDetail(d){const shad=d.type==='shad', girl=d.type==='girl';const name=d.name;return `${header(name,shad?'Shadchan · Jerusalem':girl?'Girl · profile saved':'Guy · profile saved',true)}<div class="contacts"><button class="contact">${icon('call')}Call</button><button class="contact">${icon('msg')}WhatsApp</button><button class="contact">${icon('mail')}Email</button><button class="contact">${icon('note')}Note</button></div>${shad?`<div class="attention"><div class="small">Waiting on them</div><div class="big">Leah’s feedback · 3 days</div></div><div class="attention blue"><div class="small">Waiting on me</div><div class="big">Send updated profile v3</div></div>`:girl?`<div class="focus"><div class="eyebrow">Idea for me</div><h3 style="margin:4px 0">Suggested by Miriam · Aug 3</h3><p>No shidduch yet.</p><div class="btnrow"><button class="secondary">Not applicable</button><button class="primary" onclick="openMatch('Me ↔ Leah')">Interested</button></div></div>`:''}<div class="sectionhead"><h2>Overview</h2></div><div class="info"><div class="info-line"><div class="info-key">Last contact</div><div class="info-val">Call · Aug 21</div></div><div class="info-line"><div class="info-key">How I know ${shad?'her':'them'}</div><div class="info-val">Met Jan 12 · +4 sources ›</div></div>${shad?'<div class="info-line"><div class="info-key">My profile</div><div class="info-val">Has v2 · newer v3 available</div></div>':'<div class="info-line"><div class="info-key">Profile</div><div class="info-val">Version 1 · received from Miriam</div></div>'}</div><div class="sectionhead"><h2>${shad?'Active shidduchim':'Shidduchim'}</h2></div><div class="list"><button class="row" onclick="openMatch('Me ↔ Leah')"><div class="avatar gold">♥</div><div class="rowmain"><div class="name">Me ↔ Leah</div><div class="desc">${girl?'Idea · not started':'Round 1 · waiting for her side'}</div></div><span class="chev">›</span></button></div><div class="sectionhead"><h2>History</h2><span>All</span></div>${timeline()}`}
function timeline(){return `<div class="card" style="padding:8px 13px"><div class="timeline"><div class="event"><div class="dotline"><span class="edot"></span><span class="eline"></span></div><div><div class="event-title">WhatsApp message</div><div class="event-sub">“She’s thinking about it…”</div><div class="event-time">Today · 14:05</div></div></div><div class="event"><div class="dotline"><span class="edot"></span><span class="eline"></span></div><div><div class="event-title">Call</div><div class="event-sub">Spoke for 7 minutes · Leah discussed</div><div class="event-time">Aug 21</div></div></div><div class="event"><div class="dotline"><span class="edot"></span><span class="eline"></span></div><div><div class="event-title">Profile received</div><div class="event-sub">Leah profile v1</div><div class="event-time">Aug 3</div></div></div></div></div>`}
function matchDetail(d){return `${header(d.name,'Round 1 · active',true)}<div class="focus"><div class="eyebrow">Current state</div><h3 style="margin:5px 0 0">Waiting for her side</h3><p>Miriam said she is thinking about it.</p></div><div class="summary"><div class="sum follow"><div class="n">Yes</div><div class="l">My side</div></div><div class="sum them"><div class="n">…</div><div class="l">Her side</div></div><div class="sum me"><div class="n">1</div><div class="l">Next action</div></div></div><div class="sectionhead"><h2>Next</h2></div><div class="attention"><div class="small">Waiting on them</div><div class="big">Her answer via Miriam</div></div><div class="sectionhead"><h2>Dates</h2><span>See all</span></div><div class="list"><button class="row"><div class="avatar blue">1</div><div class="rowmain"><div class="name">Date 1</div><div class="desc">Thu Aug 13 · happened · both feedback in</div></div><span class="chev">›</span></button></div><div class="sectionhead"><h2>Recent history</h2></div>${timeline()}`}
function sourceDetail(){return `${header('Rivka’s 10 shadchanim','Source · Jun 8 · WhatsApp',true)}<div class="summary"><div class="sum follow"><div class="n">10</div><div class="l">Total</div></div><div class="sum me"><div class="n">6</div><div class="l">Contacted</div></div><div class="sum them"><div class="n">3</div><div class="l">Replied</div></div></div><div class="focus"><div class="focus-top"><div class="focus-icon">${icon('note')}</div><div><h3>1 needs follow-up</h3><p>One quiet follow-up for the whole list.</p></div></div></div><div class="sectionhead"><h2>People</h2><span>Progress updates automatically</span></div><div class="list">${shadchanim.slice(0,10).map((p,i)=>`<button class="row" onclick="openPerson('shad','${p.name}')"><div class="avatar">${p.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div class="rowmain"><div class="name">${p.name}</div><div class="desc">${i<3?'Replied':i<6?'Contacted':i===6?'Follow up':'Not contacted'}</div></div><span class="chev">›</span></button>`).join('')}</div>`}
function render(){applyPrefs();let body;if(state.detail){body=state.detail.kind==='person'?personDetail(state.detail):state.detail.kind==='match'?matchDetail(state.detail):sourceDetail()}else if(state.screen==='recent')body=recent();else if(state.screen==='girls'||state.screen==='guys')body=peopleScreen(state.screen);else if(state.screen==='shadchanim')body=shadchanScreen();else body=shidduchim();$('#app').innerHTML=`<main class="screen">${body}</main>${nav()}`}
function nav(){if(state.detail)return `<nav class="nav">${navBtns()}</nav>`;return `<nav class="nav">${navBtns()}</nav>`}
function navBtns(){return [['recent','recent','Recent'],['guys','guys','Guys'],['girls','girls','Girls'],['shadchanim','shad','Shadchanim'],['shidduchim','match','Shidduchim']].map(([s,i,l])=>`<button class="${state.screen===s?'on':''}" onclick="setScreen('${s}')">${icon(i)}<span>${l}</span></button>`).join('')}
function openSettings(){$('#overlay').innerHTML=`<div class="scrim" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="handle"></div><h2>Appearance</h2><p>These settings change only the interface, never the data.</p><div class="setting"><label>Mode</label><div class="options"><button class="option ${state.mode==='single'?'on':''}" onclick="setPref('mode','single')">Single</button><button class="option ${state.mode==='shadchan'?'on':''}" onclick="setPref('mode','shadchan')">Shadchan</button></div></div><div class="setting"><label>Theme</label><div class="options"><button class="option ${state.theme==='warm'?'on':''}" onclick="setPref('theme','warm')">Warm</button><button class="option ${state.theme==='dark'?'on':''}" onclick="setPref('theme','dark')">Dark</button></div></div><div class="setting"><label>Density</label><div class="options"><button class="option ${state.density==='comfortable'?'on':''}" onclick="setPref('density','comfortable')">Comfortable</button><button class="option ${state.density==='compact'?'on':''}" onclick="setPref('density','compact')">Compact</button></div></div><div class="setting"><label>Summary cards</label><div class="options"><button class="option ${state.summary?'on':''}" onclick="setPref('summary',true)">Show</button><button class="option ${!state.summary?'on':''}" onclick="setPref('summary',false)">Hide</button></div></div><button class="primary" style="width:100%;margin-top:14px" onclick="closeSheet()">Done</button></div></div>`}
function showFilters(){$('#overlay').innerHTML=`<div class="scrim" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="handle"></div><h2>More filters</h2><p>Secondary controls stay here instead of filling the main screen.</p><div class="setting"><label>Needs contact</label><button class="option" onclick="state.screen='shadchanim';state.filter='Needs contact';closeSheet();render()">Show</button></div><div class="setting"><label>Dormant 60+ days</label><button class="option">Show</button></div><div class="setting"><label>Sort</label><div class="options"><button class="option on">Last contact</button><button class="option">A–Z</button></div></div><div class="setting"><label>Group</label><div class="options"><button class="option on">None</button><button class="option">Source</button></div></div><button class="primary" style="width:100%;margin-top:14px" onclick="closeSheet()">Done</button></div></div>`}
function setPref(k,v){state[k]=v;if(k==='theme')localStorage.zaTheme=v;if(k==='density')localStorage.zaDensity=v;if(k==='summary')localStorage.zaSummary=v?'show':'hide';if(k==='mode')localStorage.zaMode=v;applyPrefs();openSettings();render()}
function closeSheet(){$('#overlay').innerHTML=''}
init();
</script>
</body>
</html>
